<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#09090B"/>

  <!-- Decorative orbs -->
  <circle cx="1100" cy="100" r="200" fill="#8B5CF6" opacity="0.15"/>
  <circle cx="100" cy="530" r="180" fill="#06B6D4" opacity="0.12"/>

  <!-- Logo box -->
  <rect x="525" y="140" width="150" height="150" rx="24" fill="#18181B" stroke="url(#grad)" stroke-width="3"/>
  <text x="600" y="235" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#textGrad)" text-anchor="middle">MZH</text>

  <!-- Name -->
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="url(#textGrad)" text-anchor="middle">Md Zeeshan Haider</text>

  <!-- Title -->
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="32" fill="#FAFAFA" text-anchor="middle">Flutter Developer</text>

  <!-- Tagline -->
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="20" fill="#A1A1AA" text-anchor="middle">Building beautiful mobile &amp; web experiences</text>

  <!-- Bottom accent line -->
  <rect x="500" y="530" width="200" height="4" rx="2" fill="url(#grad)"/>
</svg>
