<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#09090B"/>

  <!-- Subtle decorative orbs -->
  <circle cx="1050" cy="80" r="250" fill="#8B5CF6" opacity="0.08"/>
  <circle cx="150" cy="550" r="200" fill="#06B6D4" opacity="0.06"/>

  <!-- MZH Logo Box - centered -->
  <rect x="450" y="165" width="300" height="300" rx="48" fill="#18181B" stroke="url(#grad)" stroke-width="4"/>
  <text x="600" y="350" font-family="Arial, sans-serif" font-size="100" font-weight="bold" fill="url(#grad)" text-anchor="middle">MZH</text>
</svg>
