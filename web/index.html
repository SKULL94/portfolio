  <!-- Loading screen styles -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0A0E21;
    }
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0A0E21;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
      font-family: 'Courier New', monospace;
    }
    .loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .terminal {
      background: #1D1E33;
      border-radius: 12px;
      padding: 24px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(108, 99, 255, 0.3);
      min-width: 320px;
    }
    .terminal-header {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .terminal-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .terminal-dot.red { background: #ff5f56; }
    .terminal-dot.yellow { background: #ffbd2e; }
    .terminal-dot.green { background: #27ca40; }
    .terminal-line {
      color: #B0B0B0;
      font-size: 14px;
      margin: 8px 0;
      opacity: 0;
      animation: fadeIn 0.3s forwards;
    }
    .terminal-line:nth-child(2) { animation-delay: 0.2s; }
    .terminal-line:nth-child(3) { animation-delay: 0.5s; }
    .terminal-line:nth-child(4) { animation-delay: 0.8s; }
    .terminal-line:nth-child(5) { animation-delay: 1.1s; }
    .terminal-line .prompt {
      color: #27ca40;
    }
    .terminal-line .command {
      color: #00D9FF;
    }
    .terminal-line .path {
      color: #6C63FF;
    }
    .terminal-line .success {
      color: #27ca40;
    }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 16px;
      background: #6C63FF;
      margin-left: 4px;
      animation: blink 1s infinite;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="loading-screen" class="loading-screen">
    <div class="terminal">
      <div class="terminal-header">
        <div class="terminal-dot red"></div>
        <div class="terminal-dot yellow"></div>
        <div class="terminal-dot green"></div>
      </div>
      <div class="terminal-line"><span class="prompt">$</span> <span class="command">cd</span> <span class="path">~/portfolio</span></div>
      <div class="terminal-line"><span class="prompt">$</span> <span class="command">flutter run</span> -d web</div>
      <div class="terminal-line"><span class="success">Compiling...</span></div>
      <div class="terminal-line"><span class="success">Launching MZH Portfolio</span><span class="cursor"></span></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      const loader = document.getElementById('loading-screen');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(() => loader.remove(), 300);
      }
    });
  </script>
</body>
